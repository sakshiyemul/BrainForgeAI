version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: brainforge-mysql
    restart: always
    environment:
      MYSQL_DATABASE: brainforgeai
      MYSQL_ROOT_PASSWORD: BrainForge@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pBrainForge@123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BrainForgeAI/BrainForgeAI
      dockerfile: Dockerfile
    container_name: brainforge-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/brainforgeai?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: BrainForge@123
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./BrainForgeAI-Frontend
      dockerfile: Dockerfile
    container_name: brainforge-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
